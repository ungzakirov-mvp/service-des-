services:
  backend:
    build: .
    container_name: backend
    environment:
      - TELEGRAM_CLIENT_BOT_TOKEN=${TELEGRAM_CLIENT_BOT_TOKEN}
      - TELEGRAM_AGENT_BOT_TOKEN=${TELEGRAM_AGENT_BOT_TOKEN}
      - DATABASE_URL=sqlite:///./data/servicedesk.db
      - SECRET_KEY=${SECRET_KEY}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - ALLOWED_ORIGINS=https://srv1652374.hstgr.cloud,http://72.61.136.204,http://localhost
    volumes:
      - ./data:/code/data
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
